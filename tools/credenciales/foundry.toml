[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# The deploy script writes deploy/<chainid>.json
fs_permissions = [{ access = "read-write", path = "./deploy" }]

[fmt]
line_length = 120

[lint]
lint_on_build = false
