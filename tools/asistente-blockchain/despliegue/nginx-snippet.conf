# Asistente-juego de la Diplomatura en Blockchain en https://licdia.unlu.edu.ar/blockchain-dev/api/
#
# Va en /etc/nginx/snippets/asistente-blockchain.conf, incluido desde el server{} del sitio (sites-enabled/default),
# junto al de dev-ia. No se recorta el prefijo: la app ya sirve bajo /blockchain-dev/api/. El widget (js/ y css/) lo
# sirve nginx como el resto del sitio estático.

# Respuesta en flujo (Server-Sent Events): sin búfer, sin caché, sin gzip, conexión HTTP/1.1 sostenida.
location = /blockchain-dev/api/chat {
    limit_req zone=bc_chat burst=10 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    # 12 mensajes de hasta 4000 caracteres en el peor caso; lo normal son pocos KB.
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8021;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    gzip off;
    chunked_transfer_encoding on;
}

location = /blockchain-dev/api/estado {
    limit_req zone=bc_estado burst=30 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Insignia o certificado ganado (solo suma a los contadores del día)
location = /blockchain-dev/api/evento {
    limit_req zone=bc_evento burst=10 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Medición anónima del embudo (backend/medicion.py): beacons chicos, solo POST
location = /blockchain-dev/api/m {
    limit_req zone=bc_medicion burst=40 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    # Siempre pisado con la dirección real: la app solo cree X-Real-IP si viene de PROXIES_CONFIABLES (127.0.0.1)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Relayer de la cadena real (backend/cadena.py). Con CADENA_MODO=simulado todo responde 409 y el widget sigue con su
# cadena simulada. Escrituras: firma del visitante + espera del recibo (hasta ~30 s), por eso el timeout de 60 s.
location = /blockchain-dev/api/cadena/estado {
    limit_req zone=bc_estado burst=30 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
location ~ ^/blockchain-dev/api/cadena/(sellar|token|fondear|pagar|insignia)$ {
    limit_req zone=bc_cadena burst=10 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Moderación previa de los textos que van a la cadena (backend/moderacion.py): anda también en modo simulado.
location = /blockchain-dev/api/cadena/revisar {
    limit_req zone=bc_revisar burst=10 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 20s;
}

# Cualquier otra ruta de la API no existe
location /blockchain-dev/api/ { return 404; }
