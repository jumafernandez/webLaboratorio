# Zonas de límite de tasa del asistente-juego de Blockchain.
# Va en /etc/nginx/conf.d/asistente-blockchain-zonas.conf: limit_req_zone solo vale en el contexto http.
# Los nombres llevan el prefijo bc_ para no chocar con las zonas asistente_* de dev-ia.
#
# Cada pregunta paga una llamada al modelo de lenguaje: 15 por minuto es holgado para una persona y corta a un script.
# La clave es la dirección de origen y la UNLu sale por pocas direcciones compartidas, por eso la ráfaga del snippet
# es generosa. El tope diario por persona y el de gasto los lleva el backend (backend/topes.json).
limit_req_zone $binary_remote_addr zone=bc_chat:10m rate=15r/m;
# /estado se pide una vez por visita (si hay IA y contadores del día) y no cuesta nada.
limit_req_zone $binary_remote_addr zone=bc_estado:10m rate=120r/m;
# /evento llega solo al ganar una insignia o el certificado: se limita el abuso de los contadores.
limit_req_zone $binary_remote_addr zone=bc_evento:10m rate=30r/m;
# /m: unos pocos beacons por nivel jugado; el backend además lleva 300 por día por origen.
limit_req_zone $binary_remote_addr zone=bc_medicion:10m rate=60r/m;
# /cadena/<escritura>: cada una es una tx que paga el relayer. Una partida completa son ~12; el backend lleva además
# topes por minuto y por día por origen y uno global (CADENA_*).
limit_req_zone $binary_remote_addr zone=bc_cadena:10m rate=12r/m;
# /cadena/revisar: cada texto libre que va a la cadena (3 por partida, más los reintentos) paga una llamada a un
# modelo chico; el backend lo cuenta además en los topes de pedidos por origen.
limit_req_zone $binary_remote_addr zone=bc_revisar:10m rate=20r/m;
