# /etc/systemd/system/postgresql@17-main.service.d/memoria.conf (lo copia instalar.sh)
# Tope de memoria de PostgreSQL: si se pasa, se reinicia él y no los otros servicios de la VM. Con 45 conexiones
# consultando a la vez sumó 80 MB (26/10/2026); por encima de MemoryHigh el sistema le recupera memoria antes de llegar
# al tope.
[Service]
MemoryHigh=768M
MemoryMax=1G
