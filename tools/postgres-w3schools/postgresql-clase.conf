# Va en /etc/postgresql/17/main/conf.d/clase.conf (lo copia instalar.sh).
#
# Escucha en todas las interfaces: desde afuera de la UNLu el 5432 está filtrado y los estudiantes llegan por el 80
# solo mientras pg-puerto80 lo desvía. pg_hba.conf deja entrar desde afuera únicamente al grupo alumnos, con SSL.
listen_addresses = '*'

# Hasta 60 conexiones del usuario alumno (pgAdmin abre una para el árbol y una por pestaña de consulta), más las de
# administración.
max_connections = 100

# Memoria chica: la VM la comparte con rag-unlu y los asistentes, y la base pesa pocos MB.
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Queda en el registro quién se conectó y desde dónde.
log_connections = on
