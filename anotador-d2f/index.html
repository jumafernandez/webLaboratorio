<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Anotación de parafraseos del LLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Herramienta de trabajo sobria: una oración por vez; debajo, cada acción y cada dato de su etiqueta con su respuesta. */
:root {
  color-scheme: light;
  --fondo: #f4f6f8; --papel: #ffffff; --tinta: #17212b; --tenue: #566472; --borde: #d3dbe3;
  --acento: #1f5f8b; --si: #1d7a55; --no: #b3402f; --duda: #8a6a14;
  /* acción en azul y datos en violeta; la oración en verde */
  --f: #1f5f8b; --f-fondo: #e9f2f9; --d: #6b3fa0; --d-fondo: #f3edf9;
  --r: #1d7a55; --r-fondo: #ebf6f0; --r-borde: #b9dcc8;
  --clave: #b07800; --clave-fondo: #fff5dc;
  --cuerpo: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --literal: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --texto: 15.5px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --fondo: #12181f; --papel: #1b232c; --tinta: #e6ecf2; --tenue: #9db0c0; --borde: #33414f;
    --acento: #6fb3e0; --si: #5cc79c; --no: #ef8f7f; --duda: #dcb95a;
    --f: #6fb3e0; --f-fondo: #1a2b39; --d: #bb9cf0; --d-fondo: #282136;
    --r: #5cc79c; --r-fondo: #17302a; --r-borde: #2f5a48;
    --clave: #dcb95a; --clave-fondo: #33291a;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; padding: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--cuerpo); font-size: 16px; line-height: 1.45; overflow-x: clip; }
.hoja, #trabajo { display: flex; flex-direction: column; gap: 14px; }
.hoja { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.titulos { display: flex; flex-direction: column; gap: 2px; }
h1 { font-size: 21px; font-weight: 600; margin: 0; text-wrap: balance; }
.anotador { margin: 0; font-size: 13.5px; color: var(--tenue); }
.idiomas { display: flex; flex-shrink: 0; border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; }
.idiomas button { min-height: 32px; padding: 4px 10px; border: 0; border-radius: 0; font-size: 13.5px; font-weight: 600; color: var(--tenue); background: var(--papel); }
.idiomas button + button { border-left: 1px solid var(--borde); }
.idiomas button[aria-pressed="true"] { color: #fff; background: var(--acento); }
@media (prefers-color-scheme: dark) { .idiomas button[aria-pressed="true"] { color: #10161c; } }
.clave { margin: 0; padding: 10px 12px; background: var(--clave-fondo); border-left: 4px solid var(--clave); border-radius: 4px; font-size: 14.5px; }
.clave strong { font-weight: 600; }
.mono { font-family: var(--literal); font-size: 13.5px; color: var(--tinta); }
details.ejemplo { background: var(--papel); border: 1px solid var(--borde); border-radius: 6px; padding: 10px 14px; font-size: 14.5px; }
details.ejemplo summary { cursor: pointer; font-weight: 600; }
.ejemplo p { margin: 8px 0 4px; }
.ejemplo ul { margin: 0; padding-left: 18px; }
.ejemplo li { margin: 5px 0; }
.quien { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--papel); border: 1px solid var(--borde); border-radius: 6px; padding: 12px 14px; }
.quien label { font-weight: 600; }
.quien input { font: inherit; color: var(--tinta); background: var(--fondo); border: 1px solid var(--borde); border-radius: 6px; padding: 9px 10px; flex: 1 1 180px; }
.avance { display: flex; flex-direction: column; gap: 6px; }
.avance-fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--tenue); font-variant-numeric: tabular-nums; }
#cuenta { color: var(--tinta); font-weight: 600; }
.barra { height: 6px; background: var(--borde); border-radius: 3px; overflow: hidden; }
.barra > div { height: 100%; width: 0; background: var(--acento); transition: width .2s; }
.aviso { display: none; padding: 10px 12px; border: 1px solid var(--borde); border-left: 4px solid var(--duda); background: var(--papel); font-size: 14.5px; }
.aviso.listo { border-left-color: var(--si); }
.aviso.visible { display: block; }
.aviso button { margin-top: 8px; }
#copia { display: block; width: 100%; min-height: 120px; margin-top: 8px; font-family: var(--literal); font-size: 12.5px; color: var(--tinta); background: var(--fondo); border: 1px solid var(--borde); }
.oracion { background: var(--r-fondo); border: 1px solid var(--r-borde); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rotulo { font-size: 12.5px; font-weight: 600; color: var(--r); }
.literal { margin: 0; font-family: var(--literal); font-size: var(--texto); line-height: 1.5; overflow-wrap: anywhere; }
.pregunta { margin: 0; padding: 10px 12px; border: 1px solid var(--borde); border-left: 4px solid var(--q); border-radius: 6px; background: var(--q-fondo); }
.pregunta.q-f { --q: var(--f); --q-fondo: var(--f-fondo); }
.pregunta.q-d { --q: var(--d); --q-fondo: var(--d-fondo); }
.pregunta legend { float: left; width: 100%; padding: 0; margin-bottom: 6px; font-weight: 600; color: var(--q); }
.pregunta legend + * { clear: both; }
.pregunta small { display: block; color: var(--tinta); font-size: 13.5px; font-weight: 400; margin-top: 2px; }
.fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-top: 1px solid color-mix(in srgb, var(--q) 25%, transparent); border-radius: 4px; }
.fila:first-child { border-top: 0; }
.fila.activa { outline: 2px solid var(--q); outline-offset: -1px; }
.etq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: var(--texto); }
.chip { padding: 1px 9px; border-radius: 999px; font-family: var(--literal); font-size: var(--texto); color: var(--q); background: var(--papel); border: 1px solid color-mix(in srgb, var(--q) 40%, transparent); overflow-wrap: anywhere; }
.glosa { color: var(--tinta); }
.vacio { margin: 4px 6px; color: var(--tenue); font-style: italic; }
.lista { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 12px; }
.opciones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pregunta.activa { outline: 2px solid var(--q); outline-offset: 1px; }
button { font: inherit; color: var(--tinta); background: var(--papel); border: 1px solid var(--borde); border-radius: 6px; padding: 8px 10px; min-height: 42px; cursor: pointer; }
button:hover { border-color: var(--acento); }
button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.opcion[aria-pressed="true"] { color: #fff; font-weight: 600; border-color: transparent; }
@media (prefers-color-scheme: dark) { .opcion[aria-pressed="true"] { color: #10161c; } }
.opcion.si[aria-pressed="true"] { background: var(--si); }
.opcion.no[aria-pressed="true"] { background: var(--no); }
.opcion.duda[aria-pressed="true"] { background: var(--duda); }
.navegar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
#posicion { color: var(--tenue); font-size: 14px; font-variant-numeric: tabular-nums; }
.mapa { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
@media (max-width: 420px) { .mapa { grid-template-columns: repeat(10, 1fr); gap: 4px; } }
.celda { aspect-ratio: 1; min-width: 0; min-height: 0; padding: 0; border-radius: 2px; background: var(--fondo); border: 1px solid var(--borde); }
.celda.parcial { background: var(--borde); }
.celda.completa { background: var(--acento); border-color: var(--acento); }
.celda.actual { outline: 2px solid var(--tinta); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .barra > div { transition: none; } }
</style>
</head>
<body>
<div class="hoja">
  <header>
    <div class="titulos">
      <h1 data-t="titulo"></h1>
      <p class="anotador" id="quien-es" hidden></p>
    </div>
    <div class="idiomas" role="group" aria-label="Idioma / Language">
      <button type="button" data-l="es" aria-pressed="false">ES</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <p class="clave" data-th="clave"></p>

  <details class="ejemplo">
    <summary data-t="ayuda"></summary>
    <div data-th="ayudaTexto"></div>
  </details>

  <form class="quien" id="quien" hidden>
    <label for="nombre" data-t="tuNombre"></label>
    <input id="nombre" autocomplete="given-name" required>
    <button type="submit" data-t="empezar"></button>
  </form>

  <div id="trabajo" hidden>
    <div class="avance">
      <div class="avance-fila"><span id="cuenta"></span><span id="estado"></span></div>
      <div class="barra"><div id="relleno"></div></div>
    </div>

    <div class="aviso" id="aviso"></div>

    <section class="oracion" aria-live="polite">
      <div class="rotulo" data-t="oracion"></div>
      <p class="literal" id="reescritura"></p>
    </section>

    <fieldset class="pregunta q-f" id="q-acto">
      <legend><span data-t="accion"></span><small data-t="accionPregunta"></small></legend>
      <div class="lista" id="lista-acto"></div>
      <div class="opciones" data-q="acto"><button type="button" class="opcion si" data-v="si" data-t="si"></button><button type="button" class="opcion no" data-v="no" data-t="no"></button><button type="button" class="opcion duda" data-v="duda" data-t="duda"></button></div>
    </fieldset>

    <fieldset class="pregunta q-d" id="q-datos">
      <legend><span data-t="datos"></span><small data-t="datosPregunta"></small></legend>
      <div class="lista" id="lista-datos"></div>
      <div class="opciones" data-q="datos"><button type="button" class="opcion si" data-v="si" data-t="si"></button><button type="button" class="opcion no" data-v="no" data-t="no"></button><button type="button" class="opcion duda" data-v="duda" data-t="duda"></button></div>
    </fieldset>

    <nav class="navegar">
      <button type="button" id="anterior" data-t="anterior"></button>
      <span id="posicion"></span>
      <button type="button" id="siguiente" data-t="siguiente"></button>
    </nav>

    <div class="mapa" id="mapa"></div>
  </div>
</div>
